version: '3.8'

services:
  # Core Unified Cloud Application & API Daemon
  app:
    # node:sqlite (server/db.mjs) requires Node.js 22.5+
    image: node:22-alpine
    container_name: unified-cloud-core
    restart: always
    working_dir: /usr/src/app
    environment:
      - NODE_ENV=production
      - PORT=3000
      # The app is only reachable through the nginx proxy below, which sets X-Real-IP
      - TRUST_PROXY=1
      # Optional first-run Super Admin (demo accounts are not usable in production)
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - PUBLIC_DOMAIN=example.com
      - WWW_DOMAIN=www.example.com
      - ADMIN_DOMAIN=admin.example.com
      - PARTNER_DOMAIN=partners.example.com
      - API_DOMAIN=api.example.com
      - WHMCS_API_URL=${WHMCS_API_URL:-https://billing.unifiedit.xyz/includes/api.php}
      - WHMCS_API_IDENTIFIER=${WHMCS_API_IDENTIFIER}
      - WHMCS_API_SECRET=${WHMCS_API_SECRET}
      - CLOUDSTACK_API_URL=${CLOUDSTACK_API_URL:-http://cloudstack.dhaka.unifiedit.xyz:8080/client/api}
      - CLOUDSTACK_API_KEY=${CLOUDSTACK_API_KEY}
      - CLOUDSTACK_SECRET_KEY=${CLOUDSTACK_SECRET_KEY}
      - AGENTIC_WEBHOOK_SECRET=${AGENTIC_WEBHOOK_SECRET:-}
      - AGENTIC_WHMCS_PID_READY_MADE=${AGENTIC_WHMCS_PID_READY_MADE:-}
      - AGENTIC_WHMCS_PID_CUSTOM_BRANDED=${AGENTIC_WHMCS_PID_CUSTOM_BRANDED:-}
      - AGENTIC_WHMCS_PID_CHAT_ONLY=${AGENTIC_WHMCS_PID_CHAT_ONLY:-}
      - AGENTIC_WHMCS_ADDON_MAINTENANCE=${AGENTIC_WHMCS_ADDON_MAINTENANCE:-}
      - AGENTIC_WHMCS_ADDON_BACKUP=${AGENTIC_WHMCS_ADDON_BACKUP:-}
      - AGENTIC_WHMCS_PAYMENT_METHOD=${AGENTIC_WHMCS_PAYMENT_METHOD:-}
      - WHMCS_CLIENT_AREA_URL=${WHMCS_CLIENT_AREA_URL:-}
      - AGENTIC_TELEPHONY_PROVIDER=${AGENTIC_TELEPHONY_PROVIDER:-}
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
      - app-data:/usr/src/app/data
    command: ["node", "server/server.mjs"]
    networks:
      - unified-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/public/plans"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Production Reverse Proxy (Nginx)
  proxy:
    image: nginx:alpine
    container_name: unified-cloud-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/unified-cloud.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt
      - certs-data:/var/www/certbot
    depends_on:
      app:
        condition: service_healthy
    networks:
      - unified-net

networks:
  unified-net:
    driver: bridge

volumes:
  app-data:
    driver: local
  certs:
    driver: local
  certs-data:
    driver: local
